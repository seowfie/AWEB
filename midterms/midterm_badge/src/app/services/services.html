<h2>Services</h2>

<div style="margin-bottom: 30px;">
  <input
    type="text"
    [(ngModel)]="searchTerm"
    placeholder="🔍 Search for something..."
  >
</div>

<div *ngIf="errorMessage" style="background: #ffcfcf; color: #a63e3e; padding: 20px; border-radius: 20px; border: 2px solid #e28e8e; margin-bottom: 20px;">
  {{ errorMessage }}
</div>

<div *ngIf="posts$ | async as posts; else loading">

  <div *ngFor="let post of posts | filterPosts:searchTerm">
    <div class="cute-card">

      <small style="color: #7fa1c3; font-weight: bold; background: #eef6ff; padding: 4px 10px; border-radius: 10px;">
        #{{ post.id }}
      </small>

      <h3 style="margin-top: 10px;">{{ post.title | titlecase }}</h3>

      <p>{{ post.body | truncate:120 }}</p>

    </div>
  </div>

  <div *ngIf="(posts | filterPosts:searchTerm).length === 0 && !errorMessage">
    <p style="text-align: center; color: #999;">No magical services found matching that name! ✨</p>
  </div>

</div>

<ng-template #loading>
  <div *ngIf="!errorMessage">
    <p style="text-align: center; font-weight: bold; color: #a7cfff;">
      Loading magic... ☁️
    </p>
  </div>
</ng-template>
